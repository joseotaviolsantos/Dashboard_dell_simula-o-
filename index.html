// ===== LÓGICA DO DASHBOARD =====
let currentData = [...rawData];
let chartProdutos, chartCanal, chartRegiao, chartReceita;

function formatCurrency(v){return 'R$ '+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function getUnique(arr,key){return [...new Set(arr.map(i=>i[key]))].filter(Boolean).sort();}

// Popula produtos
(()=>{
const sel=document.getElementById('filterProduto');
getUnique(rawData,'produto').forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});
})();

function applyFilters(){
const regiao=document.getElementById('filterRegiao').value;
const produto=document.getElementById('filterProduto').value;
const valMin=parseFloat(document.getElementById('filterValorMin').value)||0;
const valMax=parseFloat(document.getElementById('filterValorMax').value)||Infinity;
const qtdMin=parseInt(document.getElementById('filterQtdMin').value)||0;
const qtdMax=parseInt(document.getElementById('filterQtdMax').value)||Infinity;
currentData=rawData.filter(d=>{
if(regiao!=='all'&&d.regiao!==regiao)return false;
if(produto!=='all'&&d.produto!==produto)return false;
if(d.receita<valMin||d.receita>valMax)return false;
if(d.qtd<qtdMin||d.qtd>qtdMax)return false;
return true;
});
renderDashboard();
}

function renderDashboard(){
const data=currentData;
// KPI
const prodQtd={};data.forEach(d=>{prodQtd[d.produto]=(prodQtd[d.produto]||0)+d.qtd;});
let topProd='—',topQtd=0;for(const[p,q]of Object.entries(prodQtd)){if(q>topQtd){topQtd=q;topProd=p;}}
document.getElementById('kpiTopProduct').textContent=topProd;
document.getElementById('kpiTopProductSub').innerHTML=`<i class="fas fa-arrow-up"></i> ${topQtd} und`;
document.getElementById('kpiTopDemand').textContent=topProd;
document.getElementById('kpiTopDemandSub').innerHTML=`<i class="fas fa-boxes"></i> ${topQtd} und`;

const canalCount={};data.forEach(d=>{canalCount[d.canal]=(canalCount[d.canal]||0)+1;});
let topCanal='—',topCC=0;for(const[c,n]of Object.entries(canalCount)){if(n>topCC){topCC=n;topCanal=c;}}
const pct=data.length?((topCC/data.length)*100).toFixed(1):0;
document.getElementById('kpiTopChannel').textContent=topCanal;
document.getElementById('kpiTopChannelSub').innerHTML=`<i class="fas fa-percent"></i> ${pct}% vendas`;

const totalRev=data.reduce((s,d)=>s+d.receita,0);
document.getElementById('kpiTotalRevenue').textContent=formatCurrency(totalRev);
document.getElementById('kpiTotalSub').innerHTML=`<i class="fas fa-shopping-cart"></i> ${data.length} transações`;

// Table
const tbody=document.getElementById('tableBody');
const slice=data.slice(0,50);
tbody.innerHTML=slice.map(d=>`<tr><td style="font-weight:500;color:#0076C8">${d.id}</td><td>${d.regiao}</td><td>${d.estado}</td><td><strong>${d.produto}</strong></td><td>${d.qtd}</td><td>${formatCurrency(d.preco)}</td><td>${formatCurrency(d.receita)}</td><td>${d.canal}</td><td><span class="status-badge ${d.status.toLowerCase()}">${d.status}</span></td></tr>`).join('');
document.getElementById('tableCount').textContent=data.length;
document.getElementById('rowCount').textContent=data.length;

// Charts
updateCharts(data);
}

function updateCharts(data){
const prodMap={},canalMap={},regiaoMap={},prodRec={};
data.forEach(d=>{prodMap[d.produto]=(prodMap[d.produto]||0)+d.qtd;canalMap[d.canal]=(canalMap[d.canal]||0)+d.qtd;regiaoMap[d.regiao]=(regiaoMap[d.regiao]||0)+d.qtd;prodRec[d.produto]=(prodRec[d.produto]||0)+d.receita;});
const sortObj=o=>Object.fromEntries(Object.entries(o).sort((a,b)=>b[1]-a[1]));
const p=sortObj(prodMap),c=sortObj(canalMap),r=sortObj(regiaoMap),pr=sortObj(prodRec);
const colors=['#0076C8','#004B87','#2A8DDB','#6BB5F0','#B3D9F5','#9AC2E0','#5E9EC0','#1F6390'];
const getCol=i=>colors[i%colors.length];

const pL=Object.keys(p).slice(0,8),pV=Object.values(p).slice(0,8);
if(chartProdutos)chartProdutos.destroy();
chartProdutos=new Chart(document.getElementById('chartProdutos'),{type:'bar',data:{labels:pL,datasets:[{label:'Qtd',data:pV,backgroundColor:pL.map((_,i)=>getCol(i)),borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

const cL=Object.keys(c),cV=Object.values(c);
if(chartCanal)chartCanal.destroy();
chartCanal=new Chart(document.getElementById('chartCanal'),{type:'doughnut',data:{labels:cL,datasets:[{data:cV,backgroundColor:cL.map((_,i)=>getCol(i)),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},cutout:'65%'}});

const rL=Object.keys(r),rV=Object.values(r);
if(chartRegiao)chartRegiao.destroy();
chartRegiao=new Chart(document.getElementById('chartRegiao'),{type:'bar',data:{labels:rL,datasets:[{label:'Qtd',data:rV,backgroundColor:rL.map((_,i)=>getCol(i+2)),borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

const recL=Object.keys(pr).slice(0,8),recV=Object.values(pr).slice(0,8);
if(chartReceita)chartReceita.destroy();
chartReceita=new Chart(document.getElementById('chartReceita'),{type:'line',data:{labels:recL,datasets:[{label:'Receita',data:recV,borderColor:'#0076C8',backgroundColor:'rgba(0,118,200,0.08)',fill:true,tension:0.3,pointBackgroundColor:recL.map((_,i)=>getCol(i)),pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$'+(v/1000).toFixed(0)+'k'}}}}});
}

function resetFilters(){
document.getElementById('filterRegiao').value='all';
document.getElementById('filterProduto').value='all';
document.getElementById('filterValorMin').value='0';
document.getElementById('filterValorMax').value='500000';
document.getElementById('filterQtdMin').value='0';
document.getElementById('filterQtdMax').value='20';
applyFilters();
}

document.getElementById('applyFilters').addEventListener('click',applyFilters);
document.getElementById('resetFilters').addEventListener('click',resetFilters);
document.querySelectorAll('#filterSection input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters();}));
applyFilters();
</script>
